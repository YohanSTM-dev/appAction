services:

  # ── Base de données MySQL ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: appaction_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appAction
      MYSQL_USER: appAction
      MYSQL_PASSWORD: appAction
    ports:
      - "3307:3306"   # 3307 côté hôte pour ne pas conflicture avec un MySQL local
    volumes:
      - mysql_data:/var/lib/mysql          # données persistantes
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql  # schéma + seed
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appAction", "-pappAction"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend Node.js/Express ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appaction_backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: appAction
      DB_PASSWORD: appAction
      DB_NAME: appAction
      DB_PORT: 3306
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    # Lance le seed au démarrage (génère les vrais hash bcrypt)
    command: >
      sh -c "node src/server.js & sleep 5 && node scripts/seed-users.js ; wait"

  # ── Frontend React (build nginx) ──────────────────────────────────────────
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: appaction_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  mysql_data:
